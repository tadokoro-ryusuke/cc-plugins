# =============================================================================
# ai-review.yml — AIコードレビュー(二段構成)
#
#   Job 1: 全PR         → Sonnet 軽量レビュー(--max-turns 5)
#   Job 2: Tier 2 パス  → Opus 深堀りセキュリティレビュー(--max-turns 8)
#
# 認証: AWS Bedrock 東京 + OIDC(静的キーなし)。秘匿情報要件に合わせ
#       コードが Anthropic 直 API に出ない構成。
#
# 運用: Phase 1 はコメントのみ(既定。ゲートは観測モード)。
#       各レビュー job は verdict(JSON artifact)を出力し、集約 job "ai-review-gate" が
#       CRITICAL 件数を機械的に検査する。Phase 2 では
#         1. リポジトリ変数 AI_REVIEW_ENFORCE=true を設定(ゲート強制化)
#         2. branch protection の required check に "ai-review-gate" を1本追加
#       の2手で強制化する(prompt 内の exit 1 に依存しない、監査可能なゲート)。
#
# 前提:
#   - IAM ロール(GITHUB_OIDC_ROLE)に bedrock:InvokeModel* を付与し、
#     GitHub OIDC の federated credential を設定済み
#   - Bedrock ap-northeast-1 で対象モデルの推論プロファイルを有効化済み
#     (--model は自社で有効化済みの inference profile ID に置換すること)
# =============================================================================
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Tier 判定 — critical paths に触れているかで深堀りレビューの要否を決める
  # ---------------------------------------------------------------------------
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!github.event.pull_request.draft"
    outputs:
      tier2: ${{ steps.filter.outputs.critical }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            critical:
              # === Tier 2: 変更したら Opus 深堀り + 人間の精査必須のパス ===
              - 'src/lib/auth/**'
              - 'src/lib/permissions/**'      # テナント/ユーザー間アクセス制御
              - 'src/middleware.ts'
              - 'prisma/migrations/**'
              - 'infra/**'
              - '.github/workflows/**'         # CI設定自体の改変
              - '**/*.env*'

  # ---------------------------------------------------------------------------
  # 全PR: Sonnet 軽量レビュー
  # ---------------------------------------------------------------------------
  review:
    name: "ai-review"
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ap-northeast-1

      # モデル ID はリポジトリ変数で指定する(テンプレートには書かない)。未設定ならエージェントを動かす前に止める
      - name: Require the model variable
        id: model
        env:
          MODEL: ${{ vars.HOTL_MODEL_LIGHT }}
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::Set the repository variable HOTL_MODEL_LIGHT (see ADJUST.md)"
            exit 1
          fi

      # 判定ファイルの置き場所を、エージェントの前に新しく用意する(前回の判定を残さない)
      - name: Prepare the verdict directory
        id: verdict-dir
        run: |
          rm -rf "$RUNNER_TEMP/review-light"
          mkdir -p "$RUNNER_TEMP/review-light"

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          # 使えるのは読み取り、PR へのコメント(上流の PR レビュー例と同じ手段)、判定ファイル1つへの書き込みだけ。
          # github_token を明示し、書き込み権限を持つ Claude GitHub App トークンを渡さない。
          # リポジトリ(PR の head を含む)の .claude/settings.json や .mcp.json で権限が広がらないよう、user 設定だけを読む
          github_token: ${{ github.token }}
          prompt: |
            このPRをレビューしてください。CLAUDE.md のレビュー規範に従うこと。

            ## 指摘の分類(必ずこの4段階で)
            - CRITICAL: セキュリティ脆弱性、データ損失、権限バイパス、秘匿情報境界の破壊
            - HIGH: 正しさに影響するバグ、契約(API/型)違反
            - MEDIUM: 保守性・性能の問題
            - LOW: 提案(コメントするが数を絞る)

            ## ノイズ抑制ルール(重要)
            - スタイル指摘はしない(L1 lintの仕事)
            - 「〜を検討しては」系の曖昧な提案は書かない
            - 確信がない指摘には [要確認] を付けて根拠のファイル:行を示す
            - 指摘ゼロなら「重大な問題なし」とだけ書く。無理に指摘を作らない

            ## 出力
            1. PRコメントで結果サマリ(CP2で人間が3分で読める分量)
            2. 個別指摘は該当行へのインラインコメント
            3. 今回のレビュー結果を、Write で `${{ runner.temp }}/review-light/verdict.json` に
               書き込む(ディレクトリは用意済み)。リポジトリ内にある verdict は決して流用しない。
               {"critical": <非負整数>, "high": <非負整数>,
                "head_sha": "${{ github.event.pull_request.head.sha }}"} を書き込む。
               指摘ゼロなら件数は 0。必ずこの head revision をレビューすること
          claude_args: |
            --max-turns 5
            --model ${{ vars.HOTL_MODEL_LIGHT }}
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Grep,Glob,Bash,Write"
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit(/${{ runner.temp }}/review-light/verdict.json)"

      # ゲート判定用の structured 出力(集約 job が読む)
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-verdict-light
          path: ${{ runner.temp }}/review-light/verdict.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Tier 2 のみ: Opus 深堀りセキュリティレビュー
  # ---------------------------------------------------------------------------
  deep-review:
    name: "ai-review-deep (Tier 2)"
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.tier2 == 'true'
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ap-northeast-1

      # モデル ID はリポジトリ変数で指定する(テンプレートには書かない)。未設定ならエージェントを動かす前に止める
      - name: Require the model variable
        id: model
        env:
          MODEL: ${{ vars.HOTL_MODEL_DEEP }}
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::Set the repository variable HOTL_MODEL_DEEP (see ADJUST.md)"
            exit 1
          fi

      # 判定ファイルの置き場所を、エージェントの前に新しく用意する(前回の判定を残さない)
      - name: Prepare the verdict directory
        id: verdict-dir
        run: |
          rm -rf "$RUNNER_TEMP/review-deep"
          mkdir -p "$RUNNER_TEMP/review-deep"

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          # 使えるのは読み取り、PR へのコメント(上流の PR レビュー例と同じ手段)、判定ファイル1つへの書き込みだけ。
          # github_token を明示し、書き込み権限を持つ Claude GitHub App トークンを渡さない
          github_token: ${{ github.token }}
          prompt: |
            このPRは認証・権限・DBスキーマ・インフラ等のクリティカルパスに触れて
            います(Tier 2)。攻撃者の視点で深堀りレビューしてください。

            ## 必須チェック観点
            1. 認可バイパス: 権限チェックの追加漏れ・順序変更・条件緩和
            2. テナント/ユーザー間アクセス制御: 検索フィルタが呼び出しユーザーの
               権限スコープを必ず経由しているか。フィルタなしで index に
               クエリが飛ぶ経路が新設されていないか
            3. SQLi / パラメータ未バインド / ORM の raw query
            4. secrets・接続文字列・トークンの直書き、ログへの漏出
            5. migration の破壊的変更(カラム削除・型変更)とロールバック手順の有無
            6. GitHub Actions 改変の場合: permissions 昇格、pull_request_target
               の危険な使用、未pinのサードパーティ action
            7. プロンプトインジェクション面: 外部入力(文書・メール本文)が
               エージェントの指示として解釈されうる経路の新設

            ## 出力
            観点ごとに「問題なし / 指摘あり(根拠付き)」を明記した監査形式の
            レポートをPRコメントに投稿。攻撃シナリオが成立する指摘は PoC 手順
            の概要まで書くこと。
            新しい verdict を、Write で `${{ runner.temp }}/review-deep/verdict.json` に書き込むこと
            (ディレクトリは用意済み)。リポジトリ内の verdict は流用しない。この head をレビューする。
            {"critical": <非負整数>, "high": <非負整数>,
             "head_sha": "${{ github.event.pull_request.head.sha }}"} を書き込むこと。
          claude_args: |
            --max-turns 8
            --model ${{ vars.HOTL_MODEL_DEEP }}
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Grep,Glob,Bash,Write"
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit(/${{ runner.temp }}/review-deep/verdict.json)"

      # ゲート判定用の structured 出力(集約 job が読む)
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-verdict-deep
          path: ${{ runner.temp }}/review-deep/verdict.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 集約ゲート — Phase 2 の required check はこの1本を指定する。
  # verdict(JSON)の CRITICAL 合計で機械的に判定するため、prompt の挙動に依存しない。
  # Phase 1(vars.AI_REVIEW_ENFORCE 未設定)では観測のみで fail しない。
  # ---------------------------------------------------------------------------
  ai-review-gate:
    name: "ai-review-gate"
    runs-on: ubuntu-latest
    needs: [classify, review, deep-review]
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      # 強制化の前に assets/scripts/check_review_verdicts.py を base ブランチの
      # このパスへ配置する。PR 側が持ち込んだゲートスクリプトは決して実行しない。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false
      # 名前で1つずつ取得する。download-artifact v5 以降は、pattern が1件だけに当たると path の直下に
      # 展開するため、通常の PR(light だけ)で validator が読む場所から外れる
      - name: Download light verdict
        id: light-verdict
        continue-on-error: true # 取得の失敗はどちらの Phase でも validator が報告する(outcome を渡す)
        uses: actions/download-artifact@v8
        with:
          name: ai-review-verdict-light
          path: verdicts/ai-review-verdict-light
      - name: Download deep verdict
        id: deep-verdict
        if: needs.classify.outputs.tier2 == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ai-review-verdict-deep
          path: verdicts/ai-review-verdict-deep

      - name: Enforce gate
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          DEEP_RESULT: ${{ needs.deep-review.result }}
          ENFORCE: ${{ vars.AI_REVIEW_ENFORCE }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          TIER2: ${{ needs.classify.outputs.tier2 }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          LIGHT_DOWNLOAD: ${{ steps.light-verdict.outcome }}
          DEEP_DOWNLOAD: ${{ steps.deep-verdict.outcome }}
        run: python3 .trusted/.github/scripts/check_review_verdicts.py
