# =============================================================================
# agent-implement.yml — CP1(Spec承認)→ 実装 → Draft PR
#
# HOTLの起点。人間の仕事は Issue の Spec を承認して `agent:approved` ラベルを
# 付けるだけ。以降は Draft PR 作成まで自動。
#
# Issue テンプレート(.github/ISSUE_TEMPLATE/feature.yml)には以下を必須項目に:
#   - 目的(why)/ 受入条件(Given-When-Then 形式)/ 非スコープ / 影響パス
# → これがそのまま SDD の「spec」になる。曖昧な Issue にラベルを付けない
#   ことが CP1 の品質を決める。
#
# ガードレール:
#   - 実装前にラベル付与者のリポジトリ admin 権限を検証する(authorize job)
#   - Draft PR 止まり(Ready for review にするのは人間)
#   - main への直 push は branch protection が拒否
#   - Issue 本文は非信頼のプロンプト入力として扱う(prompt injection がエージェントに
#     届く経路)。外部者が Issue を起票できる環境では、environment approval の追加・
#     起票者の trusted 判定・CP1 で人間が本文を確定してからラベルを付ける運用を
#     必ず組み合わせること
#   - エージェントに直接のコマンドとして事前承認するのは --allowedTools で明示したものだけ
#     (計画コメント、Issue のブランチの作成と push、lint / typecheck / test)。push 先は
#     Issue のブランチに固定し、gh api・merge・force push・依存の追加は与えない。
#     リポジトリ側の settings と .mcp.json は読まない(--setting-sources user / --strict-mcp-config)
#   - PR はエージェントに作らせない。エージェントはタイトルと本文をファイルに書くだけにし、
#     信頼側の step が repo・head・base・Draft を固定して作る(gh pr create の引数の組み合わせは
#     接頭辞の許可では縛りきれないため)
#   - 残るリスク: lint / typecheck / test と git commit(フック)はリポジトリのコードを実行し、
#     この job の認証情報(書き込み可能なトークン、Bedrock 用の AWS 認証)が環境にある。
#     Issue 経由の prompt injection で書かれたコードが、それを読み出しうる。その子プロセスの
#     中の操作は上の事前承認では制限されない。上の承認運用で抑える
# =============================================================================
name: Agent Implement

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.label.name == 'agent:approved'
    outputs:
      authorized: ${{ steps.actor.outputs.authorized }}
    steps:
      - uses: actions/github-script@v7
        id: actor
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.payload.sender.login
            });
            if (data.permission !== 'admin') {
              core.setFailed('The approval label must be applied by a repository admin.');
              return;
            }
            core.setOutput('authorized', 'true');

  implement:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Settings > Environments > agent-implement に Required reviewers を設定すると、
    # ラベル付与後にもう1段の人間承認を挟める(外部起票がある環境で推奨)。
    # environment を未設定のままなら保護なしで従来どおり即実行される
    environment: agent-implement
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ADAPT: 依存はエージェントの前にロックファイルどおり入れる(エージェントには install を許さない)。
      # パッケージマネージャと Node の版は ci.yml と揃える
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ap-northeast-1

      # モデル ID はリポジトリ変数で指定する(テンプレートには書かない)。未設定ならエージェントを動かす前に止める
      - name: Require the model variable
        id: model
        env:
          MODEL: ${{ vars.HOTL_MODEL_LIGHT }}
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::Set the repository variable HOTL_MODEL_LIGHT (see ADJUST.md)"
            exit 1
          fi

      # PR のタイトルと本文の置き場所を、エージェントの前に新しく用意する
      - name: Prepare the pull request draft directory
        id: pr-dir
        run: |
          rm -rf "$RUNNER_TEMP/agent-pr"
          mkdir -p "$RUNNER_TEMP/agent-pr"

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          prompt: |
            Issue #${{ github.event.issue.number }} を実装してください。

            ## 手順(SDD: plan → implement → verify)
            1. Issue 本文の受入条件を読み、実装計画を `gh issue comment ${{ github.event.issue.number }}`
               で投稿(影響ファイル・アプローチ・リスク)。受入条件が曖昧・矛盾して
               いる場合は実装せず、質問コメントを投稿して終了すること
            2. `git switch -c agent/issue-${{ github.event.issue.number }}` でブランチを作成
            3. CLAUDE.md の規約に従い実装。受入条件ごとに対応するテストを先に
               書く(TDD)。テストなしの実装は不可
            4. `pnpm lint`・`pnpm typecheck`・`pnpm test` を実行し、全部通るまで修正。
               仕様とテストが矛盾して通せないと判断したら、テストも実装も曲げず、根拠を
               書いた質問コメントを Issue に投稿して終了すること
            5. `git add`・`git commit` の後、`git push -u origin agent/issue-${{ github.event.issue.number }}`
               で push する。PR は作らない(後の step が Draft で作る)。代わりに、PR のタイトルを1行で
               `${{ runner.temp }}/agent-pr/title.txt` に、本文を `${{ runner.temp }}/agent-pr/body.md` に
               Write で書く。本文には以下を必ず含める:
               - `Closes #${{ github.event.issue.number }}`
               - 受入条件と検証結果の対応表
               - 自己申告のリスクポイント(人間レビュアーが見るべき箇所)
               - 変更・削除した既存テストとその根拠(無ければ「なし」)

            ## 禁止事項
            - Issue に書かれていないスコープの変更(気づいた改善は別Issueを起票)
            - 依存パッケージの追加(必要なら計画コメントで承認を求める)
            - migration を含む変更での既存カラム削除
            - 既存のテスト・スナップショット・カバレッジ閾値を、Issue の受入条件に根拠のない形で
              削除・skip 化・緩和して通すこと
          claude_args: |
            --max-turns 30
            --model ${{ vars.HOTL_MODEL_LIGHT }}
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Grep,Glob,Edit,MultiEdit,Write,Bash"
            --allowedTools "Read,Grep,Glob,Edit,MultiEdit,Write,Bash(gh issue comment ${{ github.event.issue.number }}:*),Bash(git switch -c agent/issue-${{ github.event.issue.number }}),Bash(git status),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin agent/issue-${{ github.event.issue.number }}),Bash(pnpm lint),Bash(pnpm typecheck),Bash(pnpm test:*),Edit(/${{ runner.temp }}/agent-pr/title.txt),Edit(/${{ runner.temp }}/agent-pr/body.md)"

      # PR は信頼側の step で、repo・head・base・Draft を固定して作る。
      # ADAPT: GITHUB_TOKEN で作った PR では pull_request の workflow が自動では走らない。PR 上で CI や
      # ai-review を走らせたいなら、独自の GitHub App を用意して vars.HOTL_APP_ID と
      # secrets.HOTL_APP_PRIVATE_KEY を設定する(ADJUST.md 参照)
      - name: Create a GitHub App token for the pull request
        id: app-token
        if: vars.HOTL_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.HOTL_APP_ID }}
          private-key: ${{ secrets.HOTL_APP_PRIVATE_KEY }}
          # PR の作成に必要な権限だけに絞る(App に付与された権限すべてを引き継がない)
          permission-contents: read
          permission-pull-requests: write

      - name: Open the draft pull request
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: agent/issue-${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          PR_DIR: ${{ runner.temp }}/agent-pr
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # エージェントがブランチを push していなければ作らない(質問コメントで終了した場合など)
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No branch $BRANCH was pushed; no pull request is created"
            exit 0
          fi
          # 既にある PR は、人間が Ready にしたものも含めて変えない
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH already exists; it is left unchanged"
            exit 0
          fi
          title=$(head -n 1 "$PR_DIR/title.txt" 2>/dev/null || true)
          [ -n "$title" ] || title="Implement #$ISSUE"
          body="$PR_DIR/body.md"
          if ! [ -f "$body" ] || ! grep -q '[^[:space:]]' "$body"; then
            printf 'エージェントが本文を書かなかった。Actions run を参照: %s\n' "$RUN_URL" > "$body"
          fi
          grep -qE "Closes #${ISSUE}([^0-9]|$)" "$body" || printf '\nCloses #%s\n' "$ISSUE" >> "$body"
          gh pr create --repo "$GH_REPO" --draft --head "$BRANCH" --base "$BASE" \
            --title "$title" --body-file "$body"
