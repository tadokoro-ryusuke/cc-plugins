# =============================================================================
# eval-gate.yml — エージェント系(RAG/検索QA等)の評価ゲート(CP4のエビデンス生成)
#
# 発火条件:
#   - PR: プロンプト / 検索ロジック / モデル設定 / ツール定義の変更時
#         → smoke スイート(~20件、must-pass 含む)
#   - nightly: full スイート(全golden set)+ baseline 更新判定
#
# 思想:
#   - 「プロンプト変更はコード変更と同じ重さの変更管理対象」
#   - デプロイ単位は agent version(モデル+プロンプト+ツール定義の束)
#   - ゲートは (a) must-pass ケース100%(権限境界・injection)
#             (b) 平均スコアが baseline - 許容幅 以上
#   - レポートは PR コメント + artifact(90日)+ S3 退避(J-SOX証跡)
#
# 秘匿データ注意:
#   golden set に実データを含める場合は repo に置かない。
#   S3(ap-northeast-1, アクセス制御済み)から CI 実行時に取得する。
#   repo にはサニタイズ済みサンプルのみコミットする。
#
# セキュリティ注意(PR トリガーと secrets):
#   この workflow は PR の evals/** 変更で発火する。evaluator と thresholds は信頼済みの
#   base 側から実行し、候補(PR)側の内容はデータとして扱う。evals/** と .github/workflows/
#   を CODEOWNERS の Tier 2 に含め、レビューなしで eval runner を差し替えられない
#   ことを必ず担保する(fork PR には GitHub 仕様で secrets は渡らないが、
#   同一 repo のブランチ PR・エージェント生成 PR は対象になる)。
#   加えて PR 実行では runner コードを base 側から checkout する(下記 trusted runner)。
#   PR で runner 自体を変更した場合、その runner が secrets 付きで走るのはマージ後。
# =============================================================================
name: Eval Gate

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/retrieval/**"
      - "src/agent/**"
      - "evals/**"
      - "agent.config.*"
  schedule:
    - cron: "30 18 * * *" # 03:30 JST nightly full
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke | full"
        default: "full"

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-northeast-1
      # ADAPT: PR 実行では分離された preview を解決して向ける。共有 staging を対象にする場合、
      # レスポンスの revision が EXPECTED_REVISION と一致しない限り PR の合格証跡にならない
      TARGET_ENDPOINT: ${{ vars.TARGET_STAGING_ENDPOINT }}
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_API_KEY: ${{ secrets.TARGET_STAGING_API_KEY }}
      # judge に使うモデル(Bedrock 東京)。生成側と分けるのが理想
      JUDGE_MODEL: apac.anthropic.claude-sonnet-4-5-20250929-v1:0
    steps:
      - name: Prepare fresh evaluation artifacts
        id: artifacts
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/eval-out.XXXXXX")
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # PR 実行では runner コードを base 側(信頼済み)から取る。候補側の thresholds 変更で
      # ゲートを緩めることはできない。runner コード自体の差し替えは
      # マージ後まで secrets 付きで実行されない(悪意ある PR による API キー流出の遮断)
      - name: Checkout trusted runner (base)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ap-northeast-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "anthropic[bedrock]" boto3

      # 実データ golden set は S3 から取得(repo にはサンプルのみ)
      - name: Fetch golden dataset
        run: |
          aws s3 cp s3://${{ vars.EVAL_BUCKET }}/golden/golden.jsonl \
            evals/golden/golden.jsonl
          aws s3 cp s3://${{ vars.EVAL_BUCKET }}/baseline/baseline.json \
            evals/baseline.json

      - name: Run evals
        id: run
        env:
          EVAL_OUT: ${{ steps.artifacts.outputs.directory }}
        run: |
          SUITE="${{ github.event_name == 'pull_request' && 'smoke' || (inputs.suite || 'full') }}"
          RUNNER="evals/run_evals.py"
          THRESHOLDS="evals/thresholds.json"
          # PR 時は base 側の runner と thresholds を使う(上の trusted checkout 参照)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RUNNER=".trusted/evals/run_evals.py"
            THRESHOLDS=".trusted/evals/thresholds.json"
          fi
          python "$RUNNER" \
            --dataset evals/golden/golden.jsonl \
            --suite "$SUITE" \
            --thresholds "$THRESHOLDS" \
            --expected-revision "$EXPECTED_REVISION" \
            --baseline evals/baseline.json \
            --out "$EVAL_OUT"

      # --- CP4 エビデンス: PR コメントにレポートを貼る ---
      - name: Post report to PR
        if: always() && steps.artifacts.outcome == 'success' && steps.artifacts.outputs.directory != '' && steps.run.outcome != 'skipped' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eval-report
          path: ${{ steps.artifacts.outputs.directory }}/report.md

      # --- J-SOX 証跡: artifact + S3(不変ストレージ)へ退避 ---
      - name: Upload artifact
        if: always() && steps.artifacts.outcome == 'success' && steps.artifacts.outputs.directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: ${{ steps.artifacts.outputs.directory }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Archive to S3 (audit trail)
        if: always() && steps.artifacts.outcome == 'success' && steps.artifacts.outputs.directory != '' && steps.run.outcome != 'skipped'
        env:
          EVAL_OUT: ${{ steps.artifacts.outputs.directory }}
        run: |
          aws s3 cp "$EVAL_OUT/" \
            s3://${{ vars.EVAL_BUCKET }}/reports/${{ github.repository_id }}/${{ github.run_id }}/ \
            --recursive

      # --- nightly が全ゲート通過したら baseline を更新(CP4はPR側で担保) ---
      - name: Update baseline (nightly only)
        if: success() && github.event_name == 'schedule'
        env:
          EVAL_OUT: ${{ steps.artifacts.outputs.directory }}
        run: |
          aws s3 cp "$EVAL_OUT/results.json" \
            s3://${{ vars.EVAL_BUCKET }}/baseline/baseline.json
