name: skills drift check

# dev-core のスキル構成とマニフェストの「ずれ（drift）」を静的に検証する。
# 検証本体は scripts/check-skills-drift.mjs（Node 標準モジュールのみ・追加依存なし）。
# 加えて公式バリデータ（claude plugin validate --strict）で marketplace と
# 各プラグインのマニフェスト・構成を検証する。
# 注意: これは静的検証であり「Codex が実際に skill を認識するか」は検証しない
#       （CI に Codex CLI は無い）。実認識は docs/codex-interop/shared-skills-setup.md
#       の手動確認ログで受け入れる。

on:
  push:
    paths: &drift_paths
      - "dev-core/**"
      - "github-tools/**"
      - "ui-ux-pro-max/**"
      - "hotl-engineering/**"
      - ".claude-plugin/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/**"
      - "docs/codex-interop/**"
      - "docs/research/**"
      - ".github/workflows/skills-drift-check.yml"
  pull_request:
    paths: *drift_paths

# 同一 ref の実行が重なったら古い方をキャンセルする。
concurrency:
  group: skills-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 追加依存なし（Node 標準モジュールのみ）のため npm install は不要。
      - name: Run skills drift check
        run: node scripts/check-skills-drift.mjs
      - name: Validate skill behavior eval cases
        run: node scripts/validate-skill-evals.mjs
      - name: Validate Claude hook event compatibility
        run: |
          node scripts/validate-claude-hooks.mjs
          if node scripts/validate-claude-hooks.mjs scripts/fixtures/invalid-sessionstart-prompt-hooks.json; then
            echo "expected unsupported SessionStart prompt handler to fail"
            exit 1
          fi
      - name: Smoke-test SessionStart context hook
        run: bash dev-core/scripts/test-session-start-context.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest (strict)
        run: claude plugin validate . --strict
      - name: Validate plugin manifests (strict)
        run: |
          for plugin in dev-core github-tools ui-ux-pro-max hotl-engineering; do
            echo "::group::$plugin"
            claude plugin validate "$plugin" --strict
            echo "::endgroup::"
          done
